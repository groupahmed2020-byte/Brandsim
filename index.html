<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brand Sim - تحديث الأرقام</title>
    <style>
        /* إزالة الحواف وإعداد الصفحة لتملأ الشاشة بالكامل */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden; /* لمنع ظهور أشرطة التمرير المزدوجة */
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f4f7f6;
        }

        /* تصميم شريط Brand Sim في أعلى الصفحة */
        .header {
            background-color: #0284c7; /* لون أزرق احترافي */
            color: white;
            text-align: center;
            padding: 15px;
            font-size: 22px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 5px;
        }

        .header span {
            color: #bae6fd; /* لون أزرق فاتح لتمييز كلمة Sim */
        }

        /* تصميم النافذة التي ستعرض موقع ليان */
        iframe {
            width: 100%;
            height: calc(100vh - 60px); /* أخذ باقي مساحة الشاشة تحت الشريط */
            border: none; /* إزالة إطار النافذة لتبدو كأنها جزء من موقعك */
        }
    </style>
</head>
<body>

    <div class="header">
        Brand <span>Sim</span>
    </div>

    <iframe src="https://rn.layan-t.net/"></iframe>

</body>
</html>
