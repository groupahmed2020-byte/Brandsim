<!doctype html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
    <title>Brand Sim - تحديث خط الاتصال</title>
    
    <script src="https://cdn.jsdelivr.net/npm/firebase@10.12.0/firebase-app-compat.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/firebase@10.12.0/firebase-firestore-compat.min.js"></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0 }
        :root { --acc: #6366f1; --acc2: #818cf8; --ok: #10b981; --err: #ef4444 }
        
        /* Neon lines */
        .line { position: fixed; height: 1px; animation: lineslide linear infinite; pointer-events: none; z-index: 0 }
        @keyframes lineslide {
            0% { transform: translateX(-200%); opacity: 0 }
            20% { opacity: .7 }
            80% { opacity: .5 }
            100% { transform: translateX(300%); opacity: 0 }
        }
        
        /* Floating company cards */
        .fcard { position: fixed; border: 1px solid; border-radius: 20px; padding: 5px 13px; font-size: 11px; font-weight: 600; animation: cardfly ease-in-out infinite; pointer-events: none; z-index: 0 }
        @keyframes cardfly {
            0%, 100% { transform: translateY(0) rotate(-1deg) }
            50% { transform: translateY(-12px) rotate(1deg) }
        }
        
        body { min-height: 100vh; background: #0d0d10; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; direction: rtl; padding: 20px; position: relative; overflow: hidden }
        .card { background: #13131a; border: 1px solid #26263a; border-radius: 20px; padding: 36px 28px; width: 100%; max-width: 400px; text-align: center; position: relative; z-index: 2 }
        .logo { font-size: 40px; margin-bottom: 8px }
        .brand { font-size: 22px; font-weight: 700; color: #e2e2f0; letter-spacing: -.5px }
        .sub { font-size: 14px; color: #8888aa; margin-top: 6px; margin-bottom: 32px; line-height: 1.6 }
        .inp-wrap { position: relative; margin-bottom: 14px }
        
        .inp { width: 100%; background: #0d0d10; border: 2px solid #26263a; border-radius: 12px; padding: 16px 18px; color: #e2e2f0; font-size: 20px; font-family: "Courier New", monospace; outline: none; text-align: center; letter-spacing: 2px; direction: ltr; transition: .2s }
        .inp:focus { border-color: var(--acc) }
        .inp.ok-inp { border-color: var(--ok) }
        .inp.err-inp { border-color: var(--err) }
        .inp::placeholder { color: #44445a; letter-spacing: 0; font-family: -apple-system, sans-serif; font-size: 15px }
        
        .btn { width: 100%; padding: 16px; background: var(--acc); color: #fff; border: none; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; transition: .18s; font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 8px }
        .btn:hover { background: var(--acc2) }
        .btn:active { transform: scale(.98) }
        .btn:disabled { background: #26263a; color: #44445a; cursor: not-allowed; transform: none }
        
        @keyframes spin { to { transform: rotate(360deg) } }
        .sp { width: 18px; height: 18px; border: 2.5px solid rgba(255,255,255,.2); border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; display: inline-block }
        
        .result { margin-top: 20px; display: flex; flex-direction: column; gap: 8px }
        .res-item { background: #1c1c26; border: 1px solid #26263a; border-radius: 10px; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; font-size: 14px; animation: fadeIn .3s ease }
        .res-item.ok { border-color: rgba(16,185,129,.3); background: rgba(16,185,129,.07) }
        .res-item.er { border-color: rgba(239,68,68,.3); background: rgba(239,68,68,.07) }
        .res-item.mn { border-color: rgba(245,158,11,.3); background: rgba(245,158,11,.07) }
        .res-company { font-weight: 600; color: #e2e2f0 }
        .res-status.ok { color: var(--ok) }
        .res-status.er { color: var(--err) }
        .res-status.mn { color: #f59e0b }
        
        .err-msg { background: rgba(239,68,68,.08); border: 1px solid rgba(239,68,68,.2); border-radius: 10px; padding: 12px; color: var(--err); font-size: 13px; margin-top: 14px; display: none }
        .err-msg.show { display: block }
        .hint { font-size: 12px; color: #44445a; margin-top: 18px; line-height: 1.8 }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: translateY(0) } }
    </style>
</head>
<body>

<div class="card">
    <div class="logo">📱</div>
    <div class="brand">BRAND SIM</div>
    <div class="sub">أدخل رقم هاتفك لتحديث<br>خط الاتصال تلقائياً</div>
    
    <div class="inp-wrap">
        <input class="inp" id="phone-inp" type="tel" placeholder="05xxxxxxxx" maxlength="10" oninput="onInput()" onkeydown="if(event.key==='Enter')submit()"/>
    </div>
    
    <button class="btn" id="btn" onclick="submit()" disabled> تحديث الآن </button>
    
    <div class="err-msg" id="err-msg"></div>
    <div class="result" id="result"></div>
    <div id="anim-wrap"></div>
    
    <div class="hint">الرقم يجب أن يبدأ بـ 05<br>التحديث يتم خلال ثوانٍ</div>
</div>

<div style="text-align:center;padding:16px;font-size:11px;color:#44445a;position:relative;z-index:2">
    © 2026 Brand Sim — جميع الحقوق محفوظة
</div>

<script>
    // رابط الخادم الوسيط
    const WORKER_URL = "https://brand-sim.flutter-dart-2021-new.workers.dev/update";

    // إعدادات Firebase
    const FB_CONFIG = {
        apiKey: "YOUR_API_KEY",
        projectId: "brand-sim",
        authDomain:"brand-sim.firebaseapp.com",
    };

    let db = null;
    try {
        firebase.initializeApp(FB_CONFIG);
        db = firebase.firestore();
    } catch(e) {
        console.error("Firebase:", e);
    }

    function normalize(input) {
        let r = (input||"").replace(/[\u200B-\u200F\u202A-\u202E\uFEFF\u00A0]/g,"").replace(/[^\d+]/g,"");
        if (r.startsWith("+972")) r = "0"+r.slice(4);
        else if (r.startsWith("+970")) r = "0"+r.slice(4);
        else if (r.startsWith("00972")) r = "0"+r.slice(5);
        else if (r.startsWith("00970")) r = "0"+r.slice(5);
        else if (r.startsWith("972")) r = "0"+r.slice(3);
        else if (r.startsWith("970")) r = "0"+r.slice(3);
        else if (r.startsWith("5")&&r.length===9) r = "0"+r;
        return /^05\d{8}$/.test(r) ? r : null;
    }

    function onInput() {
        const phone = normalize(document.getElementById("phone-inp").value);
        document.getElementById("btn").disabled = !phone;
        document.getElementById("phone-inp").className = "inp";
        document.getElementById("err-msg").classList.remove("show");
        document.getElementById("result").innerHTML = "";
    }

    function showErr(msg) {
        document.getElementById("err-msg").textContent = msg;
        document.getElementById("err-msg").classList.add("show");
        document.getElementById("phone-inp").className = "inp err-inp";
    }

    async function submit() {
        const phone = normalize(document.getElementById("phone-inp").value);
        if (!phone) {
            showErr("رقم غير صحيح — يجب أن يبدأ بـ 05");
            return;
        }

        const btn = document.getElementById("btn");
        btn.disabled = true;
        btn.innerHTML = '<span class="sp"></span> جاري البحث...';
        document.getElementById("err-msg").classList.remove("show");
        document.getElementById("result").innerHTML = "";
        document.getElementById("phone-inp").className = "inp";

        try {
            const resp = await fetch(WORKER_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ phone }),
            });

            const data = await resp.json();

            if (!data.ok && resp.status === 404) {
                showErr("⚠️ الرقم " + phone + " غير مسجّل في النظام");
                btn.disabled = false;
                btn.innerHTML = "تحديث الآن";
                return;
            }

            if (!data.ok) {
                showErr("❌ " + (data.error || data.reason || "خطأ غير معروف"));
                btn.disabled = false;
                btn.innerHTML = "تحديث الآن";
                return;
            }

            document.getElementById("phone-inp").className = "inp ok-inp";
            const resultEl = document.getElementById("result");

            resultEl.innerHTML = data.results.map(r => {
                const cls = r.status === "ok" ? "ok" : r.status === "manual" ? "mn" : "er";
                const icon = r.status === "ok" ? "✅" : r.status === "manual" ? "⚠️" : "❌";
                return `
                <div class="res-item ${cls}">
                    <span class="res-company">${r.name}</span>
                    <span class="res-status ${cls}">${icon} ${r.msg}</span>
                </div>`;
            }).join("");

        } catch (e) {
            showErr("❌ تعذّر الاتصال بالخادم");
        }

        btn.disabled = false;
        btn.innerHTML = "تحديث الآن";
    }
</script>

<script>
    // كود المؤثرات البصرية (أسماء الشركات الطائرة والخطوط)
    (function(){
        const companies = [
            {name:"ليان", color:"#818cf8", bc:"rgba(99,102,241,.4)", bg:"rgba(99,102,241,.08)"},
            {name:"كويك لاين", color:"#10b981", bc:"rgba(16,185,129,.4)", bg:"rgba(16,185,129,.08)"},
            {name:"عرين", color:"#f59e0b", bc:"rgba(245,158,11,.4)", bg:"rgba(245,158,11,.08)"},
            {name:"ألوها", color:"#a78bfa", bc:"rgba(167,139,250,.4)", bg:"rgba(167,139,250,.08)"},
            {name:"سكاي", color:"#818cf8", bc:"rgba(99,102,241,.35)", bg:"rgba(99,102,241,.06)"},
        ];
        
        const positions = [
            {top:"8%",right:"4%"},{top:"18%",left:"3%"},{top:"32%",right:"3%"},
            {bottom:"22%",left:"4%"},{bottom:"12%",right:"5%"}
        ];

        companies.forEach((co,i) => {
            const fc = document.createElement("div");
            fc.className = "fcard";
            fc.textContent = co.name;
            fc.style.color = co.color;
            fc.style.borderColor = co.bc;
            fc.style.background = co.bg;
            const pos = positions[i];
            Object.keys(pos).forEach(k => fc.style[k] = pos[k]);
            fc.style.animationDuration = (3+Math.random()*1.5)+"s";
            fc.style.animationDelay = (i*0.6)+"s";
            document.body.appendChild(fc);
        });

        const lineColors = ["#6366f1","#818cf8","#10b981","#a78bfa","#f59e0b","#6366f1"];
        for(let i=0; i<6; i++) {
            const l = document.createElement("div");
            l.className = "line";
            l.style.width = (60+Math.random()*80)+"px";
            l.style.top = (5+i*16)+"%";
            l.style.background = lineColors[i];
            l.style.animationDuration = (2.5+Math.random()*2.5)+"s";
            l.style.animationDelay = (Math.random()*4)+"s";
            document.body.appendChild(l);
        }
    })();
</script>

</body>
</html>
